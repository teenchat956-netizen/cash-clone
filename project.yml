name: Cash
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Cash:
    type: application
    platform: iOS
    sources:
      - Cash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.cash
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    info:
      path: Cash/Info.plist
      properties:
        CFBundleDisplayName: Cash App
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Unlock your demo wallet.
        UIAppFonts:
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
