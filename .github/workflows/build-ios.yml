name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project Cash.xcodeproj \
            -scheme Cash \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/artifact/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Cash.app build/artifact/Payload/Cash.app
          cd build/artifact
          ditto -c -k --sequesterRsrc --keepParent Payload Cash-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cash-unsigned-IPA
          path: build/artifact/Cash-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
